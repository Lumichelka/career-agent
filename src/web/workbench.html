<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>职向 · 工作台</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#1f3a2e;--muted:#7b8b80;--line:#e2e8e1;--green:#1f6b50;--soft:#e8f1ea;--warn:#b25e22;--danger:#a63a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.75 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 26px;background:#fffdf8e8;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:600;letter-spacing:2px}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:400}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:9px;font-size:12.5px;color:#4e6558}
nav a.active{background:var(--green);color:#fff}
nav a:hover{background:var(--soft);text-decoration:none}
.spacer{flex:1}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px}
button:hover{border-color:#b9cdbd;background:#f7fbf7}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:hover{background:#1a5c44}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink)}
.btn:hover{text-decoration:none;border-color:#b9cdbd;background:#f7fbf7}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#1a5c44}
main{max-width:1120px;margin:0 auto;padding:24px 22px 80px}
.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.hero h1{margin:0;font-size:24px;letter-spacing:1px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px;color:var(--green);line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel h2 a{font-size:11px;font-weight:400}
.day{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:1px}
.ev{display:grid;grid-template-columns:70px 1fr auto;gap:10px;border:1px solid var(--line);border-left:3px solid #b9d6c4;border-radius:11px;padding:10px 12px;margin-bottom:8px;background:#fff}
.ev.warn{border-left-color:var(--warn)}
.ev.conflict{border-left-color:var(--danger);background:#fffafa}
.ev time{font-size:12px;color:var(--green);font-weight:600}
.ev .title{font-size:13.5px;font-weight:600;margin:0 0 2px}
.ev .meta{font-size:11.5px;color:var(--muted);line-height:1.6}
.ev .side{font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.flag{font-size:10px;padding:1px 7px;border-radius:20px;background:#fdf3e8;color:#8f5a20;white-space:nowrap}
.flag.bad{background:#fbeceb;color:#8f3030}
.flag.ok{background:#eef6f0;color:#3d6b52}
.chip{display:inline-block;font-size:11px;background:var(--soft);border:1px solid #d6e6db;color:#3d6b52;border-radius:20px;padding:3px 10px;margin:3px 4px 3px 0}
.chip b{font-weight:600}
.task{border-left:3px solid #b9d6c4;padding:5px 9px;margin:7px 0;background:#fbfdfb;font-size:12px}
.task.fail{border-left-color:var(--danger)}
.task .when{font-size:10.5px;color:var(--muted);margin-top:2px}
.quick{display:grid;gap:8px}
.quick a{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.quick a:hover{border-color:#b9cdbd;text-decoration:none}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;text-align:center}
.gate{position:fixed;inset:0;z-index:99;background:#f4f6f0;display:grid;place-items:center;padding:20px}
.gate[hidden]{display:none}
.gate .box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 32px;max-width:420px;text-align:center}
.gate h2{margin:0 0 8px;font-size:20px}
.gate p{color:var(--muted);font-size:12.5px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3a2e;color:#fff;padding:9px 16px;border-radius:22px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1}
@media(max-width:820px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}main{padding:16px 12px 70px}.top{padding:10px 14px;gap:10px}.hero h1{font-size:20px}.ev{grid-template-columns:58px 1fr}.ev .side{grid-column:1/-1;flex-direction:row;justify-content:flex-start}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">✧ 职向<small>WORKBENCH</small></div>
  <nav>
    <a href="/" class="active">今天</a>
    <a href="/chat">对话</a>
    <a href="/recruit">机会日历</a>
    <a href="/resume">简历与投递</a>
    <a href="/companies">公司档案</a>
  </nav>
  <div class="spacer"></div>
  <div class="right">
    <span id="engine" style="font-size:11px;color:#7b8b80"></span>
    <button id="refresh">刷新</button>
    <a href="/chat" style="font-size:12px">配置模型</a>
  </div>
</header>

<main id="main">
  <div class="hero">
    <div>
      <h1>今天，先做最重要的三件事。</h1>
      <p id="hero-sub">正在读取你的招聘库与记忆…</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn primary" href="/recruit">打开机会日历</a>
      <button id="export-ics">导出未来 30 天日历</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <section class="panel" id="upcoming">
      <h2>未来 7 天 <a href="/recruit">查看全部 →</a></h2>
      <div id="upcoming-body"><div class="empty">正在读取…</div></div>
    </section>
    <aside>
      <section class="panel">
        <h2>我的画像 <a href="/chat">管理 →</a></h2>
        <div id="profile"><div class="empty">还没有长期画像</div></div>
      </section>
      <section class="panel">
        <h2>最近任务</h2>
        <div id="tasks"><div class="empty">完成一次对话后出现</div></div>
      </section>
      <section class="panel">
        <h2>快捷入口</h2>
        <div class="quick">
          <a href="/chat"><span>和智能体对话</span><span>→</span></a>
          <a href="/recruit"><span>采集 / 筛选 / 导出</span><span>→</span></a>
          <a href="/resume"><span>简历版本 / 投递跟进</span><span>→</span></a>
          <a href="/companies"><span>公司档案 / 调研</span><span>→</span></a>
          <a href="/chat" id="model-link"><span>模型与接口设置</span><span>→</span></a>
        </div>
      </section>
    </aside>
  </div>
</main>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2>先登录再开始</h2>
    <p>工作台需要读取你的招聘库、画像和任务记录。首次使用的账号密码在数据目录的「首次登录.txt」。</p>
    <p><a class="btn primary" href="/chat">去登录 / 进入对话</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = 'SESSION_TOKEN';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const toast = text => { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000); };
const fmt = iso => { const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); };
const fmtDay = iso => { const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const fmtWhen = iso => { if (!iso) return ''; const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };

async function api(path, body) {
  const r = await fetch('/api/' + path, {method: body ? 'POST' : 'GET', headers: {'x-career-token': TOKEN, 'content-type': 'application/json'}, ...(body ? {body: JSON.stringify(body)} : {})});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error('请先登录'); e.needLogin = true; throw e; }
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function renderStats(data) {
  const s = data.schedule?.stats || {};
  const conflicts = s.conflicts || 0;
  $('#stats').innerHTML = [
    ['未来 7 天活动', data.upcomingCount ?? 0],
    ['时间冲突', conflicts],
    ['长期画像', data.memory?.counts?.profile ?? 0],
    ['技能 / 工具', (data.capabilities?.skills?.length ?? 0) + ' / ' + (data.capabilities?.tools?.length ?? 0)]
  ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
}

function renderUpcoming(schedule) {
  if (!schedule?.days?.length) { $('#upcoming-body').innerHTML = '<div class="empty">未来 7 天还没有活动。去「机会日历」采集，或换一个时间范围。</div>'; return; }
  $('#upcoming-body').innerHTML = schedule.days.map(day => {
    const items = day.items.map(({event, conflict, travel, warning}) => {
      const cls = conflict ? 'conflict' : /小于估算通勤|未公布/.test(warning || '') ? 'warn' : '';
      const flags = [];
      if (conflict) flags.push('<span class="flag bad">时间冲突</span>');
      else if (/小于估算通勤/.test(warning || '')) flags.push(`<span class="flag">${esc(warning)}</span>`);
      if (event.status === 'possibly_removed') flags.push('<span class="flag bad">可能撤下</span>');
      if (event.interviewStage) flags.push(`<span class="flag">${esc([...new Set([event.interviewStage, event.interviewType].filter(Boolean))].join(' · '))}</span>`);
      if ((event.crossSources || []).length > 1) flags.push('<span class="flag ok">多源收录</span>');
      return `<article class="ev ${cls}">
        <time>${esc(fmt(event.startAt))}${event.endAt ? '–' + esc(fmt(event.endAt)) : ''}</time>
        <div><p class="title">${esc(event.title)}</p>
        <div class="meta">${esc(event.school)} · ${esc(event.kind)}${event.venue ? ' · ' + esc(event.venue) : ''}${travel ? ' · 通勤约 ' + esc(travel.minutes) + ' 分钟' : ''}${event.mapUrl ? ' · ' + `<a href="${esc(event.mapUrl)}" target="_blank" rel="noopener noreferrer">地图</a>` : ''}</div></div>
        <div class="side">${flags.join('')}</div></article>`;
    }).join('');
    return `<div class="day">${esc(day.date)} · 周${esc(day.weekday)}</div>${items}`;
  }).join('');
}

function renderProfile(facts) {
  if (!facts?.length) { $('#profile').innerHTML = '<div class="empty">还没有长期画像。可以在「对话 → 记忆与画像」里添加。</div>'; return; }
  $('#profile').innerHTML = facts.slice(0, 8).map(f => `<span class="chip"><b>${esc(f.key)}</b>：${esc(String(f.value).slice(0, 40))}</span>`).join('');
}

function renderTasks(tasks) {
  if (!tasks?.length) { $('#tasks').innerHTML = '<div class="empty">完成一次对话后出现</div>'; return; }
  $('#tasks').innerHTML = tasks.slice(0, 5).map(t => `<div class="task ${t.status === 'failed' ? 'fail' : ''}">
    <div>${esc(t.title || '未命名任务')}${t.skill ? ' · ' + esc(t.skill) : ''}</div>
    <div class="when">${esc(fmtWhen(t.at))}${t.status === 'failed' ? ' · 失败' : ''}${t.tools?.length ? ' · ' + esc(t.tools.slice(0, 3).join(' / ')) : ''}</div>
  </div>`).join('');
}

async function load() {
  const [schedule, memory, capabilities, model] = await Promise.all([
    api('recruit/schedule?days=7'),
    api('memory'),
    api('capabilities'),
    api('model')
  ]);
  const upcomingCount = (schedule.schedule.days || []).reduce((a, d) => a + d.items.length, 0);
  renderStats({schedule: schedule.schedule, memory, capabilities, upcomingCount});
  renderUpcoming(schedule.schedule);
  renderProfile(memory.profile);
  renderTasks(memory.tasks);
  $('#engine').textContent = model.label || '';
  $('#hero-sub').textContent = upcomingCount
    ? `未来 7 天有 ${upcomingCount} 场活动，${schedule.schedule.stats.conflicts} 处时间冲突。`
    : '未来 7 天还没有活动，可以去「机会日历」采集。';
}

async function boot() {
  try { await api('auth/me'); }
  catch (e) { if (e.needLogin) { $('#gate').hidden = false; $('#main').style.visibility = 'hidden'; return; } toast(e.message); }
  try { await load(); } catch (e) { toast(e.message); }
}

$('#refresh').onclick = () => load().then(() => toast('已刷新')).catch(e => toast(e.message));
$('#export-ics').onclick = async () => {
  try {
    const r = await fetch('/api/recruit/export.ics?days=30', {headers: {'x-career-token': TOKEN}});
    if (!r.ok) throw new Error('导出失败');
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = 'zhixiang-schedule.ics'; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 2000);
    toast('已导出，导入手机日历即可');
  } catch (e) { toast(e.message); }
};

boot();
</script>
</body>
</html>
