style><aside><div class="brand">✧ 职向<small>YOUR CAREER AGENT</small></div><button class="new" id="new">＋ 新的求职对话</button><button class="new platform-launch" id="platforms">⇄ 登录型网站</button><div class="sessions" id="sessions"></div><div class="foot"><span id="engine-label" hidden></span><button id="model-settings">模型与接口设置</button><br><button id="mcp-inbound">外部 AI 接入（MCP）</button><br><button id="memory">查看本次记忆</button><br><button id="account-logout">退出账号</button><br>资料保存在本机；任务内容会发送至你选择的模型服务。</div></aside><main><header><div><button class="mobile" id="mobile-new">＋</button><button class="mobile" id="mobile-platforms" aria-label="连接平台">⇄</button><button class="mobile" id="mobile-model" aria-label="模型设置">⚙</button>职向 <span>求职智能体</span></div><span>● 联网检索 · 求职规划</span></header><div id="messages"></div><div class="composer-area"><div id="platform-gate" hidden></div><div id="status" role="status" aria-live="polite"></div><div class="composer"><div id="attachments"></div><form id="chat"><textarea id="input" placeholder="告诉我你的求职需求，或上传简历开始……" aria-label="向职向提问"></textarea><div class="bar"><div><button type="button" id="attach" title="上传简历、岗位或经验资料" aria-label="上传资料">＋</button><input hidden id="files" type="file" accept=".txt,.md,.json,.docx,.pdf" multiple></div><div><button type="button" id="stop" hidden>■ 停止</button><button class="send" id="send" aria-label="发送">↑</button></div></div></form></div><div class="hint">会主动检索公开资料，读取结果后继续处理。岗位和简历内容请核对来源与事实。</div></div></main><dialog id="dialog"><div id="dialog-content"></div><button id="close">关闭</button></dialog><div id="account-screen" style="position:fixed;inset:0;background:#f4f6f0;z-index:9999;display:grid;place-items:center"><form id="account-form" style="width:min(390px,90vw);background:white;padding:32px;border:1px solid #d7e1d9;border-radius:20px;display:grid;gap:14px"><h2 style="margin:0;color:#236c50">职向 · 共同测试</h2><p>使用独立账号保存你的对话、简历和模型配置。</p><input id="account-name" placeholder="账号（字母、数字，3至32位）" autocomplete="username" required><input id="account-password" type="password" placeholder="密码（至少10位）" autocomplete="current-password" required><button type="submit">登录</button><button type="button" id="account-register">创建测试账号</button><p id="account-error" role="alert"></p><small>首次使用的账号信息见数据目录中的「首次登录.txt」（Windows 默认在 %LOCALAPPDATA%\ZhiXiang）。分享包中不含原有账号。</small></form></div><script type="module">
const token='SESSION_TOKEN',el=s=>document.querySelector(s);let current=null,busy=false,attachments=[],controller=null,activePlan=null;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'x-career-token':token,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
async function refreshList(){const d=await api('sessions');el('#sessions').innerHTML=d.sessions.map(s=>'<button data-session="'+escape(s.id)+'" class="'+(s.id===current?.id?'selected':'')+'">'+escape(s.title)+'</button>').join('')}

function inlineText(raw){return escape(raw).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1 ↗</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function formatAnswer(raw){const lines=String(raw).split('\n');let html='',list=null;const close=()=>{if(list){html+='</'+list+'>';list=null}};for(let i=0;i<lines.length;i++){const line=lines[i].trim();if(!line){close();continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3}/.test(lines[i+1])){close();const cells=t=>t.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());html+='<div class="table-scroll"><table><thead><tr>'+cells(line).map(x=>'<th>'+inlineText(x)+'</th>').join('')+'</tr></thead><tbody>';i++;while(i+1<lines.length&&lines[i+1].includes('|')){html+='<tr>'+cells(lines[++i]).map(x=>'<td>'+inlineText(x)+'</td>').join('')+'</tr>'}html+='</tbody></table></div>';continue}const heading=line.match(/^#{1,4}\s+(.+)/),li=line.match(/^(?:[-*]|\d+\.)\s+(.+)/);if(heading){close();html+='<h3>'+inlineText(heading[1])+'</h3>'}else if(li){const type=/^\d/.test(line)?'ol':'ul';if(list!==type){close();list=type;html+='<'+type+'>'}html+='<li>'+inlineText(li[1])+'</li>'}else{close();html+='<p>'+inlineText(line)+'</p>'}}close();return html}
function chartHtml(v){if(!v?.items||v.items.length<2)return '';const rows=v.items.filter(i=>Number.isFinite(i.value)&&i.value>=0),max=Math.max(...rows.map(i=>i.value),1);return '<section class="chart" aria-label="'+escape(v.title)+'"><h3>'+escape(v.title)+'</h3>'+rows.map(i=>'<div class="chart-row"><span>'+escape(i.label)+'</span><div class="chart-track"><div class="chart-bar" style="width:'+Math.max(0,Math.min(100,i.value/max*100))+'%"></div></div><span class="chart-value">'+escape(i.value)+' '+escape(v.unit)+'</span></div>').join('')+'<div class="chart-note">'+(rows.some(i=>i.sourceUrl)?'依据本次列出的来源；请核对统计口径。':'依据你提供的数据；未作独立核验。')+'</div></section>'}

function planHtml(p){return p?'<details class="trace"><summary>本次行动计划</summary><ol>'+p.steps.map(t=>'<li>'+escape(t)+'</li>').join('')+'</ol></details>':''}
function render(){if(!current?.messages.length){el('#messages').innerHTML='<div class="welcome"><div class="mark">✧</div><div class="eyebrow">CAREER, WITH CLARITY</div><h1>下一步，走向更适合你的机会。</h1><p>告诉我你想做什么。我会追问必要信息，查资料、看岗位，或帮你修改简历。</p><div class="hints"><button data-prompt="我还不确定适合哪些岗位，先了解一下我的情况吧。"><span class="hint-icon">◎</span><strong>确定方向</strong><small>从真实经历中，找到适合的岗位</small></button><button data-prompt="我想找实习，请先问我需要哪些条件，再帮我搜索真实岗位。"><span class="hint-icon">↗</span><strong>寻找机会</strong><small>检索公开招聘，附上信息来源</small></button><button data-prompt="我想针对岗位修改简历，我会上传简历和岗位要求。"><span class="hint-icon">▤</span><strong>打磨简历</strong><small>对照岗位要求，讲好你的经历</small></button></div></div>';return}el('#messages').innerHTML=current.messages.map((m,i)=>'<article class="msg '+escape(m.role)+'"><div class="role">'+(m.role==='user'?'你':'✧ 职向')+'</div><div class="body">'+(m.role==='assistant'?formatAnswer(m.content):escape(m.content))+'</div>'+chartHtml(m.visualization)+(m.attachments?.length?'<div class="trace">附件：'+m.attachments.map(a=>escape(a.name)).join('、')+'</div>':'')+(m.sources?.length?'<div class="sources">'+m.sources.filter(s=>/^https?:\/\//i.test(s.url)).map(s=>'<a href="'+escape(s.url)+'" target="_blank" rel="noopener noreferrer">'+escape(s.title)+' ↗</a>').join('')+'</div>':'')+planHtml(m.plan)+(m.quality?'<div class="trace">交付检查：'+escape(m.quality.status==='checked'?'已检查输出与执行记录':'存在执行限制')+' · '+Math.round((m.durationMs||0)/1000)+'秒</div>':'')+(m.trace?.length?'<div class="trace">执行记录：'+m.trace.map(t=>escape(t.label)).join(' → ')+'</div>':'')+'</article>').join('');if(current.artifacts.length){const a=current.artifacts.at(-1);el('#messages').innerHTML+='<div class="artifact"><div><strong>▤ '+escape(a.title)+'</strong><div class="trace">根据本次对话生成，可查看、下载或保存到简历库</div></div><div><button id="preview-artifact">查看</button> <button id="download-artifact">下载</button> <button id="save-resume">保存为简历</button> <button id="save-interview">保存为面试准备</button> <button id="save-company">保存为公司档案</button></div></div>'}el('#messages').scrollTop=el('#messages').scrollHeight;}
function showError(message){const e=document.createElement('div');e.className='error';e.textContent=message;el('#messages').append(e);el('#messages').scrollTop=el('#messages').scrollHeight}
async function newChat(){if(busy)return;current=await api('new',{});attachments=[];renderAttachments();render();await refreshList();el('#input').focus()}
function renderAttachments(){el('#attachments').innerHTML=attachments.map((a,i)=>'<span class="file-chip">▤ '+escape(a.name)+' <button data-remove="'+i+'" aria-label="移除附件">×</button></span>').join('')}
el('#chat').onsubmit=async e=>{e.preventDefault();if(busy)return;const message=el('#input').value.trim();if(!message&&!attachments.length)return;if(!current)current=await api('new',{});const sentAttachments=[...attachments];const previous=current.messages.length;current.messages.push({role:'user',content:message,attachments:sentAttachments});render();el('#input').value='';attachments=[];renderAttachments();busy=true;activePlan=null;el('#send').disabled=true;el('#stop').hidden=false;controller=new AbortController();try{const r=await fetch('/api/chat',{method:'POST',headers:{'x-career-token':token,'content-type':'application/json'},body:JSON.stringify({id:current.id,message,attachments:sentAttachments}),signal:controller.signal});if(!r.ok){const d=await r.json();throw new Error(d.error)}const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',completed=false,failed=false;while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line)continue;const event=JSON.parse(line);if(event.type==='platform_required')showLoginGate(event);if(event.type==='platform_resolved')el('#platform-gate').hidden=true;if(event.type==='plan'){activePlan=event.plan;el('#status').textContent='行动计划：\n'+activePlan.steps.map((t,i)=>(i+1)+'. '+t).join('\n')}if(event.type==='status'||event.type==='tool')el('#status').textContent=(activePlan?'行动计划：\n'+activePlan.steps.map((t,i)=>(i+1)+'. '+t).join('\n')+'\n\n':'')+'✧ '+event.text;if(event.type==='error'){failed=true;throw new Error(event.text)}if(event.type==='done'){completed=true;current=event.session;render();await refreshList()}}}if(!completed&&!failed)throw new Error('连接结束但任务未交付，请重试。');}catch(err){if(current.messages.length===previous+1)current.messages.pop();el('#input').value=message;attachments=sentAttachments;renderAttachments();render();showError(err.name==='AbortError'?'已停止本次任务。':err.message)}finally{el('#platform-gate').hidden=true;busy=false;el('#send').disabled=false;el('#stop').hidden=true;el('#status').textContent='';controller=null}};
el('#stop').onclick=async()=>{if(current)api('stop',{id:current.id}).catch(()=>{});controller?.abort()};el('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();el('#chat').requestSubmit()}};el('#new').onclick=newChat;el('#mobile-new').onclick=newChat;el('#attach').onclick=()=>el('#files').click();
let wordParserPromise;
function loadWordParser(){if(window.mammoth)return Promise.resolve(window.mammoth);if(!wordParserPromise)wordParserPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/vendor/mammoth.js';script.onload=()=>resolve(window.mammoth);script.onerror=()=>{wordParserPromise=null;script.remove();reject(new Error('本地Word解析组件加载失败，请刷新页面重试'))};document.head.append(script)});return wordParserPromise}
el('#files').onchange=async e=>{for(const f of Array.from(e.target.files).slice(0,5-attachments.length)){try{if(f.size>8e6)throw new Error('文件超过8MB');let text='';const ext=f.name.split('.').pop().toLowerCase();el('#status').textContent='正在读取 '+f.name;if(['txt','md','json'].includes(ext))text=await f.text();else if(ext==='docx'){const lib=await loadWordParser();text=(await lib.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}else if(ext==='pdf'){const lib=await import('/vendor/pdf.mjs');lib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.mjs';const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;if(pdf.numPages>15)throw new Error('请使用15页以内的文件');for(let n=1;n<=pdf.numPages;n++){const c=await(await pdf.getPage(n)).getTextContent();text+=c.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n'}await pdf.destroy()}else throw new Error('不支持此格式');if(text.trim().length<5)throw new Error('没有读到文字，扫描件请先转文字');if(text.length>40000)throw new Error('文字过长，请分批发送');attachments.push({name:f.name,text});renderAttachments();el('#status').textContent='已读取 '+f.name+'（'+text.length+' 字），发送后即可分析'}catch(err){showError('读取 '+f.name+' 失败：'+err.message)}}e.target.value=''};

document.addEventListener('click',async e=>{
const b=e.target.closest('[data-platform-action]');if(!b)return;
const action=b.dataset.platformAction,platform=b.dataset.platform,feedback=el('#platform-feedback');
b.disabled=true;
feedback.textContent=action==='open'?'正在打开官方窗口…':action==='ocr'?'正在截图识别…':'正在读取…';
const show=(text,url)=>{feedback.textContent=text;if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=' 查看截图 ↗';feedback.append(' ',a);}};
try{
  const result=await api('platform/'+(action==='import'?'read':action),{platform});
  if(action==='probe'){feedback.textContent=(result.results||[]).map(x=>(x.ok?'✔':'✘')+' '+x.name+' '+x.status+(x.reason?' '+x.reason:'')).join('\n')+'\n'+result.message;return;}

    if(!['readable','unconfirmed','ocr_readable'].includes(result.status)||!result.text)throw new Error(result.message);
    if(attachments.length>=5)throw new Error('附件已满，请先移除一项');
    attachments.push({name:(result.name||'平台')+'页面.txt',text:JSON.stringify(result)});renderAttachments();el('#dialog').close();el('#input').focus();
  }else show(result.message+'\n页面状态：'+result.status+'\n'+(result.text?result.text.slice(0,1600):''),result.screenshotUrl);
}catch(err){feedback.textContent=err.message}finally{b.disabled=false}
});

let inboundState=null,inboundPending=false,inboundReveal=null;
async function showInbound(){inboundState=await api('mcp');inboundPending=false;inboundReveal=null;renderInbound();if(!el('#dialog').open)el('#dialog').showModal()}
function inboundClientList(){
  if(!inboundState.clients.length)return '<p class="platform-note">还没有签发任何凭据。</p>';
  return inboundState.clients.map(c=>'<div class="platform-card mcp-client-card"><div><h3>'+escape(c.name)+'</h3><p class="state">'+escape(c.tokenPrefix)+'… · '+(c.revoked?'已撤销':'有效')+' · 工具 '+c.toolCount+' 个</p><p>签发：'+escape(new Date(c.createdAt).toLocaleString())+' · 最近使用：'+escape(c.lastUsedAt?new Date(c.lastUsedAt).toLocaleString():'尚未使用')+(c.regeneratedAt?' · 重新生成：'+escape(new Date(c.regeneratedAt).toLocaleString()):'')+'</p></div><div class="platform-actions">'+(c.revoked?'':'<button data-mcp-action="regenerate" data-id="'+escape(c.id)+'">重新生成凭据</button><button data-mcp-action="revoke" data-id="'+escape(c.id)+'">撤销</button>')+'</div></div>').join('');
}
function inboundRevealHtml(){
  if(!inboundReveal)return '';
  return '<div class="mcp-reveal"><h3>凭据只显示这一次</h3><p class="platform-note">关掉对话框后只保留前缀；丢了就重新生成，旧凭据会立即失效。</p><pre>'+escape(inboundReveal.token)+'</pre>'+inboundReveal.snippets.map(s=>'<details open><summary>'+escape(s.label)+'</summary>'+(s.note?'<p class="platform-note">'+escape(s.note)+'</p>':'')+'<pre>'+escape(s.content)+'</pre><button data-copy="'+escape(s.content)+'">复制片段</button></details>').join('')+'</div>';
}
function renderInbound(){
  const s=inboundState;
  const toggle=s.enabled
    ?'<p class="state">实例开关：已开启'+(s.enabledBy?' · 开启人 '+escape(s.enabledBy):'')+'</p><div class="platform-actions"><button data-mcp-action="disable">关闭入站</button></div>'
    :(inboundPending
      ?'<div class="platform-card"><h3>确认开启对外 MCP？</h3><p>开关是实例级的：开启后，任何账号已签发的凭据都能从 /mcp 访问，但每枚凭据只落到它所属的账号。其他登录用户也能关闭它；关闭开关不会撤销已签凭据。</p><div class="platform-actions"><button data-mcp-action="cancel">取消</button><button data-mcp-action="enable">确认开启</button></div></div>'
      :'<p class="state">实例开关：已关闭（/mcp 现在返回 404）</p><div class="platform-actions"><button data-mcp-action="ask-enable">开启入站</button></div>');
  el('#dialog-content').innerHTML='<h2>外部 AI 接入（MCP）</h2><p class="platform-note">把本应用的工具接给 Claude Code / Cursor / VS Code / Codex 这类外部 AI。地址：<code>'+escape(s.url)+'</code>。'+escape(s.audience.note)+'</p>'+toggle+'<h3>签发新凭据</h3><form id="mcp-client-form" class="model-grid"><label>给这个 client 起个名字（最多 40 字）<input id="mcp-client-name" maxlength="40" placeholder="例如 Claude Code、Cursor"></label><div class="model-buttons"><button type="submit">签发凭据</button></div></form>'+inboundRevealHtml()+'<h3>已签发凭据</h3>'+inboundClientList()+'<div id="mcp-feedback" role="status"></div>';
  el('#mcp-client-form').onsubmit=async e=>{
    e.preventDefault();
    const name=el('#mcp-client-name').value.trim();
    try{const made=await api('mcp/clients',{name});inboundReveal={token:made.token,snippets:made.snippets};inboundState=await api('mcp');renderInbound()}
    catch(err){el('#mcp-feedback').textContent=err.message}
  };
}
document.addEventListener('click',async e=>{
  const copy=e.target.closest('[data-copy]');
  if(copy){
    try{await navigator.clipboard.writeText(copy.dataset.copy);el('#mcp-feedback').textContent='已复制到剪贴板。'}
    catch{el('#mcp-feedback').textContent='复制失败，请手动选中文本复制。'}
    return;
  }
  const b=e.target.closest('[data-mcp-action]');if(!b)return;
  const action=b.dataset.mcpAction;
  b.disabled=true;
  try{
    if(action==='ask-enable'){inboundPending=true;renderInbound();return}
    if(action==='cancel'){inboundPending=false;renderInbound();return}
    if(action==='enable'||action==='disable'){inboundState=await api('mcp/switch',{enabled:action==='enable',confirm:true});inboundPending=false;renderInbound();return}
    if(action==='revoke'){if(!confirm('撤销后这枚凭据立即失效，确定撤销？')){b.disabled=false;return}await api('mcp/clients/revoke',{id:b.dataset.id});inboundState=await api('mcp');renderInbound();return}
    if(action==='regenerate'){const made=await api('mcp/clients/regenerate',{id:b.dataset.id});inboundReveal={token:made.token,snippets:made.snippets};inboundState=await api('mcp');renderInbound();return}
  }catch(err){el('#mcp-feedback').textContent=err.message}finally{b.disabled=false}
});
