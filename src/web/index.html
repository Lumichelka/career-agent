function loadWordParser(){if(window.mammoth)return Promise.resolve(window.mammoth);if(!wordParserPromise)wordParserPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/vendor/mammoth.js';script.onload=()=>resolve(window.mammoth);script.onerror=()=>{wordParserPromise=null;script.remove();reject(new Error('本地Word解析组件加载失败，请刷新页面重试'))};document.head.append(script)});return wordParserPromise}
el('#files').onchange=async e=>{for(const f of Array.from(e.target.files).slice(0,5-attachments.length)){try{if(f.size>8e6)throw new Error('文件超过8MB');let text='';const ext=f.name.split('.').pop().toLowerCase();el('#status').textContent='正在读取 '+f.name;if(f.type.startsWith('image/')){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('图片读取失败'));reader.readAsDataURL(f)});attachments.push({name:f.name,type:'image',mime:f.type,dataUrl});renderAttachments();el('#status').textContent='已读取图片 '+f.name+'，发送后交给支持读图的后端';continue}if(['txt','md','json'].includes(ext))text=await f.text();else if(ext==='docx'){const lib=await loadWordParser();text=(await lib.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}else if(ext==='pdf'){const lib=await import('/vendor/pdf.mjs');lib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.mjs';const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;if(pdf.numPages>15)throw new Error('请使用15页以内的文件');for(let n=1;n<=pdf.numPages;n++){const c=await(await pdf.getPage(n)).getTextContent();text+=c.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n'}await pdf.destroy()}else throw new Error('不支持此格式');if(text.trim().length<5)throw new Error('没有读到文字，扫描件请先转文字');if(text.length>40000)throw new Error('文字过长，请分批发送');attachments.push({name:f.name,text});renderAttachments();el('#status').textContent='已读取 '+f.name+'（'+text.length+' 字），发送后即可分析'}catch(err){showError('读取 '+f.name+' 失败：'+err.message)}}e.target.value=''};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.prompt){el('#input').value=b.dataset.prompt;el('#input').focus()}if(b.dataset.remove!==undefined){attachments.splice(Number(b.dataset.remove),1);renderAttachments()}if(b.dataset.session&&!busy){current=await api('session/'+b.dataset.session);render();await refreshList()}if(b.id==='preview-artifact'){const a=current.artifacts.at(-1);el('#dialog-content').innerHTML='<h2>'+escape(a.title)+'</h2><pre>'+escape(a.content)+'</pre>';el('#dialog').showModal()}if(b.id==='download-artifact'){const a=current.artifacts.at(-1);const u=URL.createObjectURL(new Blob([a.content],{type:'text/plain;charset=utf-8'}));const d=document.createElement('a');d.href=u;d.download=a.title.replace(/[<>:"/\\|?*]/g,'-')+'.txt';d.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});

async function showPlatforms(){
const data=await api('platform/status',{});
const cards=data.platforms.map(p=>{
  const state=p.state==='closed'?'尚未打开专用浏览器':(p.blank?'页面停在 about:blank':'浏览器已打开 · 登录状态需本人确认');
  return '<section class="platform-card"><h3>'+escape(p.name)+'</h3><p class="state">'+escape(state)+'</p><p>'+escape(p.message)+'</p><div class="platform-actions"><button data-platform-action="open" data-platform="'+p.id+'">打开官方登录窗口</button><button data-platform-action="external" data-platform="'+p.id+'">系统浏览器打开</button><button data-platform-action="read" data-platform="'+p.id+'">读取页面</button><button data-platform-action="open-result" data-platform="'+p.id+'">打开第一条结果</button><button data-platform-action="ocr" data-platform="'+p.id+'">截图识别兜底</button><button data-platform-action="import" data-platform="'+p.id+'">带入对话</button><button data-platform-action="close" data-platform="'+p.id+'">关闭</button></div></section>';
}).join('');
el('#dialog-content').innerHTML='<h2>登录型网站</h2><p class="platform-note">统一管理需要本人登录的网站：BOSS直聘、小红书、实习僧、牛客、智联招聘、前程无忧、猎聘。打开后由你扫码/短信登录；智能体只读岗位、实习、笔记页面，不投递、不发消息。DOM 读取不到时可用“截图识别兜底”。</p>'+cards+'<div class="row" style="margin:10px 0"><button data-platform-action="probe">检查 7 站连通性</button></div><div id="platform-feedback" role="status"></div><p class="platform-note">若页面停在 about:blank，先点“打开官方登录窗口”重试；仍失败就用“系统浏览器打开”，在普通 Edge 里登录查看，再用“手动导入”记录。智能体不会读取系统浏览器。</p>';
if(!el('#dialog').open)el('#dialog').showModal();
}
el('#platforms').onclick=()=>showPlatforms().catch(e=>showError(e.message));el('#mobile-platforms').onclick=()=>showPlatforms().catch(e=>showError(e.message));
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-platform-action]');if(!b)return;
const action=b.dataset.platformAction,platform=b.dataset.platform,feedback=el('#platform-feedback');
b.disabled=true;
feedback.textContent=action==='open'?'正在打开官方窗口…':action==='ocr'?'正在截图识别…':'正在读取…';
const show=(text,url)=>{feedback.textContent=text;if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=' 查看截图 ↗';feedback.append(' ',a);}};
try{
  const result=await api('platform/'+(action==='import'?'read':action),{platform});
  if(action==='probe'){feedback.textContent=(result.results||[]).map(x=>(x.ok?'✔':'✘')+' '+x.name+' '+x.status+(x.reason?' '+x.reason:'')).join('\n')+'\n'+result.message;return;}
  if(action==='open'||action==='close'){await showPlatforms();el('#platform-feedback').textContent=result.message;}
  else if(action==='import'){
    if(!['readable','unconfirmed','ocr_readable'].includes(result.status)||!result.text)throw new Error(result.message);
    if(attachments.length>=5)throw new Error('附件已满，请先移除一项');
    attachments.push({name:(result.name||'平台')+'页面.txt',text:JSON.stringify(result)});renderAttachments();el('#dialog').close();el('#input').focus();
  }else show(result.message+'\n页面状态：'+result.status+'\n'+(result.text?result.text.slice(0,1600):''),result.screenshotUrl);
}catch(err){feedback.textContent=err.message}finally{b.disabled=false}
});
